name: Build and Release Server and Client Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            server_bin: dist/CollabBoardX-Server.exe
            client_bin: dist/CollabBoardX-Client.exe
            server_release: CollabBoardX-Server-windows-amd64.exe
            client_release: CollabBoardX-Client-windows-amd64.exe
          - os: ubuntu-latest
            server_bin: dist/CollabBoardX-Server
            client_bin: dist/CollabBoardX-Client
            server_release: CollabBoardX-Server-linux-amd64
            client_release: CollabBoardX-Client-linux-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings aiosqlite websockets qrcode pyinstaller

      - name: Build Both Server and Client Executables
        run: |
          python package_executable.py all

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          mkdir -p release-bin
          cp "${{ matrix.server_bin }}" "release-bin/${{ matrix.server_release }}"
          cp "${{ matrix.client_bin }}" "release-bin/${{ matrix.client_release }}"
          chmod +x release-bin/* || true

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.server_release }}
          path: release-bin/${{ matrix.server_release }}

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client_release }}
          path: release-bin/${{ matrix.client_release }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*/*
          generate_release_notes: true
          draft: false
          prerelease: false
